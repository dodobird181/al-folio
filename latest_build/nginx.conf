# Nginx configuration for sammorris.ca
# Place this file at /etc/nginx/sites-available/sammorris
# Then: sudo ln -s /etc/nginx/sites-available/sammorris /etc/nginx/sites-enabled/
# After editing: nginx -t && systemctl reload nginx

# WebP content negotiation: serve .webp variant when browser supports it
map $http_accept $webp_suffix {
    default   "";
    "~*webp"  ".webp";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sammorris.ca www.sammorris.ca;

    root /srv/sammorris/latest_build;
    index index.html;

    # Logging
    access_log /var/log/nginx/sammorris_access.log;
    error_log /var/log/nginx/sammorris_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Streamlit dashboard proxy (unchanged)
    location /samdash/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Homepage: add preload hint for profile image
    location = / {
        add_header Link "</assets/img/profile_pic_short.webp>; rel=preload; as=image; type=image/webp" always;
        try_files $uri $uri/ =404;
    }

    # WebP content negotiation for raster images
    # Serves .jpg.webp / .png.webp if browser sends Accept: image/webp
    location ~* \.(jpg|jpeg|png)$ {
        add_header Vary Accept always;
        try_files $uri$webp_suffix $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Long-term cache for all other static assets
    location ~* \.(webp|avif|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Default location
    location / {
        try_files $uri $uri/ =404;
    }

    # SSL — managed by Certbot; do not edit these lines manually
    ssl_certificate /etc/letsencrypt/live/sammorris.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sammorris.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name sammorris.ca www.sammorris.ca;

    if ($host = www.sammorris.ca) {
        return 301 https://$host$request_uri;
    }
    if ($host = sammorris.ca) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
